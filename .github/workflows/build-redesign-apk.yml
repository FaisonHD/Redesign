name: Build Redesign APK
# Eigenständiger Workflow für eine KOPIE des Repos (Fork / neues privates Repo).
# Erzeugt einen frischen Debug-Schlüssel, deshalb ist kein Backup-Artefakt nötig.
# Start: Actions -> "Build Redesign APK" -> "Run workflow".
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Create fresh debug signing key
        run: |
          mkdir -p "$RUNNER_TEMP/sign"
          keytool -genkeypair -keystore "$RUNNER_TEMP/sign/debug.keystore" -storetype JKS \
            -storepass android -keypass android -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "LIFEHUB_SIGNING_KEYSTORE=$RUNNER_TEMP/sign/debug.keystore" >> "$GITHUB_ENV"
      - name: Unit tests (Ergebnis sichtbar, blockiert die APK nicht)
        continue-on-error: true
        run: bash ./gradlew --no-daemon :planner:test :app:testDebugUnitTest
      - name: Build release APK
        run: bash ./gradlew --no-daemon :app:assembleRelease
      - name: Verify signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LifeHub-redesign-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: LifeHub-redesign-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14
